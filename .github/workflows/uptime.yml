name: Uptime check

# Why this exists: GoTrue crash-looped from 2026-07-21 to 07-26 and nobody
# noticed for five days, because the public radar and already-signed-in sessions
# keep working while new logins are dead (repo #115). Nothing was watching the
# surfaces that fail quietly. This runs off-box, so it also catches the box
# being down entirely.
#
# On failure it opens ONE issue (reused while it stays open) and comments on
# subsequent failures, then closes it automatically once everything recovers.
#
# Note: GitHub disables scheduled workflows on repos with no pushes for 60 days.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

# Least privilege: this job only files/closes an issue. Naming the full set
# drops every other scope (packages, deployments, id-token, …) to none.
permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the surfaces that fail silently
        id: probe
        env:
          ANON: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail
          API=https://api.notifier.yoshevbot.uk
          APP=https://release-notifier.yoshevbot.uk
          failures=""

          # A status code alone is not enough for the addon routes: when the
          # Worker's run_worker_first rules don't apply, the SPA fallback answers
          # with a cheerful 200 and an HTML body. So every JSON surface also
          # asserts a substring that only the real response contains.
          check() { # name, expected_code, url, [expected_substring], [header]
            local name="$1" want="$2" url="$3" needle="${4:-}" hdr="${5:-}"
            local code
            if [ -n "$hdr" ]; then
              code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 -H "$hdr" "$url" || echo 000)
            else
              code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 "$url" || echo 000)
            fi
            if [ "$code" != "$want" ]; then
              echo "FAIL $name -> HTTP $code (want $want)"
              failures="${failures}- **${name}**: HTTP \`${code}\` (expected \`${want}\`) — \`${url}\`"$'\n'
            elif [ -n "$needle" ] && ! grep -qF "$needle" /tmp/body; then
              echo "FAIL $name -> HTTP $code but body lacks '$needle'"
              failures="${failures}- **${name}**: HTTP \`${code}\` but the body did not contain \`${needle}\` (wrong handler served it?) — \`${url}\`"$'\n'
            else
              echo "ok   $name -> $code"
            fi
          }

          # Auth: the one that died quietly. Health first, then the Google
          # authorize redirect, which is what actually breaks when the
          # GOOGLE_* env vars go empty (#115) — health alone can look fine.
          check "Auth health" 200 "$API/auth/v1/health" "" "apikey: $ANON"
          check "Google sign-in redirect" 302 "$API/auth/v1/authorize?provider=google&redirect_to=$APP"

          # Data surface the whole app reads through.
          check "PostgREST (radar)" 200 "$API/rest/v1/radar_entries?select=movie_id&limit=1" \
            '"movie_id"' "apikey: $ANON"

          check "Frontend" 200 "$APP/" '<div id="root">'

          # The published addon surface, and the anonymous URL-configured one —
          # separate Worker code paths that can break independently of the site.
          # The encoded config below is the plain radar pair (#118).
          RADAR_CFG='W3siaWQiOiJuZXctZGlnaXRhbCIsInNvdXJjZSI6Im5ldy1kaWdpdGFsIn0seyJpZCI6InVwY29taW5nLWRpZ2l0YWwiLCJzb3VyY2UiOiJ1cGNvbWluZy1kaWdpdGFsIn1d'
          check "Stremio addon manifest" 200 "$APP/manifest.json" 'release-notifier.radar'
          check "Stremio addon catalog" 200 "$APP/catalog/movie/new-digital.json" '"metas"'
          check "Stremio anonymous config route" 200 "$APP/c/$RADAR_CFG/manifest.json" \
            'release-notifier.radar'

          if [ -n "$failures" ]; then
            # Randomised heredoc delimiter: a fixed "EOF" lets any future probe
            # whose response text lands in the report forge extra step outputs.
            delim="report_$(openssl rand -hex 8)"
            {
              echo "failed=true"
              echo "report<<${delim}"
              echo "$failures"
              echo "${delim}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the outage issue
        if: steps.probe.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh has no git remote to infer from.
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ steps.probe.outputs.report }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --label uptime --state open --limit 1 --json number -q '.[0].number' || true)
          body=$(printf 'Automated uptime check failed at %s UTC.\n\n%s\n[Run log](%s)\n' \
            "$(date -u '+%Y-%m-%d %H:%M')" "$REPORT" "$RUN")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "🔴 Uptime check failing" --label uptime --body "$body"
          fi

      - name: Close the outage issue once everything is healthy again
        if: steps.probe.outputs.failed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --label uptime --state open --limit 1 --json number -q '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All checks passing again — closing automatically."
          fi

      - name: Fail the run so the workflow shows red
        if: steps.probe.outputs.failed == 'true'
        run: exit 1
